<div class="main-wrapper p-0 p-md-4 pb-md-0">
  <app-feature-table
    [data]="listOfExpenses()"
    [loading]="expensesService.isSendingRequest()"
    [total]="expensesService.totalExpenses()"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    scrollX="768px"
    addLabel="Add Expense"
    emptyText="No expenses found."
    (addClick)="expensesService.showAddModal.set(true)"
    (queryParamsChange)="onQueryParamsChange($event)"
  >
    <ng-template ftColumn="title" ftLabel="Title" ftWidth="auto" let-row>
      <span class="ft-cell-text" nz-tooltip nzTooltipPlacement="top" [nzTooltipTitle]="row.title">{{
        row.title
      }}</span>
    </ng-template>

    <ng-template ftColumn="category" ftLabel="Category" ftWidth="auto" let-row>
      <span class="category-badge" [attr.data-category]="row.category">{{ row.category }}</span>
    </ng-template>

    <ng-template ftColumn="amount" ftLabel="Amount" ftWidth="auto" let-row>
      <span
        class="ft-cell-text amount-cell"
        nz-tooltip
        nzTooltipPlacement="top"
        [nzTooltipTitle]="row.amount.toString()"
      >
        ৳ {{ row.amount }}
      </span>
    </ng-template>

    <ng-template ftColumn="expensedate" ftLabel="Date" ftWidth="auto" let-row>
      <span
        class="ft-cell-text"
        nz-tooltip
        nzTooltipPlacement="top"
        [nzTooltipTitle]="formatDate(row.expenseDate)"
      >
        {{ formatDate(row.expenseDate) }}
      </span>
    </ng-template>

    <ng-template ftColumn="notes" ftLabel="Notes" ftWidth="auto" let-row>
      <span
        class="ft-cell-text"
        nz-tooltip
        nzTooltipPlacement="top"
        [nzTooltipTitle]="row.notes"
        >{{ row.notes || '-' }}</span
      >
    </ng-template>

    <ng-template ftColumn="actions" ftWidth="180px" ftAlign="center" let-row>
      <div class="ft-row-actions">
        <button
          (click)="editExpense(row.id)"
          class="drop-down-button drop-shadow-md"
          aria-label="Edit Expense"
        >
          <span nz-icon nzType="edit" nzTheme="outline"></span>
        </button>
        <button
          (click)="deleteExpense(row.id)"
          class="drop-down-button drop-shadow-md"
          aria-label="Delete Expense"
        >
          <span nz-icon nzType="delete" nzTheme="outline"></span>
        </button>
      </div>
    </ng-template>
  </app-feature-table>
</div>

<app-add-expense></app-add-expense>
