<div class="main-wrapper p-0 p-md-4 pb-md-0">
  <app-feature-table
    [data]="listOfEmployees()"
    [loading]="employeeService.isSendingRequest()"
    [total]="employeeService.totalEmployees()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    scrollX="1000px"
    addLabel="Add Employee"
    emptyText="No employees found."
    (addClick)="employeeService.showAddModal.set(true)"
    (queryParamsChange)="onQueryParamsChange($event)"
  >
    <ng-template ftColumn="image" ftWidth="80px" ftAlign="center" let-row>
      <nz-avatar [nzSize]="36" nzIcon="user" [nzSrc]="getImageUrl(row.user.image)"></nz-avatar>
    </ng-template>

    <ng-template ftColumn="name" ftLabel="Name" ftWidth="auto" let-row>
      <span class="ft-cell-text-wrapper">
        <span
          class="ft-cell-text"
          nz-tooltip
          nzTooltipPlacement="top"
          [nzTooltipTitle]="
            row.user.firstName + ' ' + row.user.middleName + ' ' + row.user.lastName
          "
        >
          {{ row.user.firstName + ' ' + row.user.middleName + ' ' + row.user.lastName }}
        </span>
        <button
          type="button"
          class="star-btn"
          [class.star-btn--filled]="employeeService.isFavourite(row.user.id)"
          (click)="$event.stopPropagation(); employeeService.toggleFavourite(row.user.id)"
          aria-label="Toggle favourite"
        >
          <span
            nz-icon
            nzType="star"
            [nzTheme]="employeeService.isFavourite(row.user.id) ? 'fill' : 'outline'"
          ></span>
        </button>
      </span>
    </ng-template>

    <ng-template ftColumn="email" ftLabel="Email" ftWidth="auto" let-row>
      <span
        class="ft-cell-text"
        nz-tooltip
        nzTooltipPlacement="top"
        [nzTooltipTitle]="row.user.email"
        >{{ row.user.email }}</span
      >
    </ng-template>

    <ng-template ftColumn="designation" ftLabel="Designation" ftWidth="auto" let-row>
      <span
        class="ft-cell-text"
        nz-tooltip
        nzTooltipPlacement="top"
        [nzTooltipTitle]="row.designation"
        >{{ row.designation }}</span
      >
    </ng-template>

    <ng-template ftColumn="joindate" ftLabel="Join Date" ftWidth="auto" let-row>
      <span
        class="ft-cell-text"
        nz-tooltip
        nzTooltipPlacement="top"
        [nzTooltipTitle]="row.joinDate | date: 'MMM dd, yyyy'"
      >
        {{ row.joinDate | date: 'MMM dd, yyyy' }}
      </span>
    </ng-template>

    <ng-template ftColumn="phone" ftLabel="Phone" ftWidth="auto" let-row>
      <span
        class="ft-cell-text"
        nz-tooltip
        nzTooltipPlacement="top"
        [nzTooltipTitle]="row.user.phoneNumber"
        >{{ row.user.phoneNumber }}</span
      >
    </ng-template>

    <ng-template ftColumn="actions" ftWidth="180px" ftAlign="center" let-row>
      <div class="ft-row-actions">
        <button
          (click)="editEmployee(row.id)"
          class="drop-down-button drop-shadow-md"
          nz-tooltip
          nzTooltipTitle="Edit employee"
          nzTooltipPlacement="top"
          aria-label="Edit Employee"
        >
          <span nz-icon nzType="edit" nzTheme="outline" aria-hidden="true"></span>
        </button>
        <button
          (click)="deleteUser(row.id)"
          class="drop-down-button drop-shadow-md"
          nz-tooltip
          nzTooltipTitle="Delete employee"
          nzTooltipPlacement="top"
          aria-label="Delete Employee"
        >
          <span nz-icon nzType="delete" nzTheme="outline" aria-hidden="true"></span>
        </button>
      </div>
    </ng-template>
  </app-feature-table>
</div>

<app-add-employee></app-add-employee>
