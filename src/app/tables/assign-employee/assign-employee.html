<ng-template #modalTitle>
  <div class="d-flex gap-1">
    <span nz-icon nzType="user-add" nzTheme="outline" aria-hidden="true"></span>
    <span>Assign Employee</span>
  </div>
</ng-template>
<nz-modal
  [(nzVisible)]="tablesService.showAssignModal"
  [nzTitle]="modalTitle"
  (nzOnCancel)="handleCancel()"
  (nzOnOk)="handleOk()"
  [nzOkLoading]="tablesService.isSendingRequest()"
  [nzWidth]="modalWidth"
  nzCentered
>
  <ng-container *nzModalContent>
    <div class="row gx-3 gy-3">
      <div class="col-12 col-md-6">
        <div class="d-flex flex-col">
          <span class="text-lg mb-3">Table Number - {{ tablesService.assignTableName() }}</span>
          <span class="text-lg mb-3">Number of Seats - {{ tablesService.assignTableSeats() }}</span>
          <img
            class="rounded-lg shadow-md"
            [src]="tablesService.assignTableImage()"
            alt="Table {{ tablesService.assignTableName() }} image"
          />
        </div>
      </div>
      <div class="col-12 col-md-6">
        <nz-select
          [nzMaxTagCount]="3"
          [nzMaxTagPlaceholder]="tagPlaceHolder"
          nzMode="multiple"
          nzPlaceHolder="Please select employees"
          [ngModel]="listOfSelectedEmployees"
          (ngModelChange)="listOfSelectedEmployees = $event"
          class="w-100 employee-select"
          nzAllowClear
          nzSize="large"
        >
          @for (emp of tablesService.listOfAvailableEmployees(); track emp.id) {
            <nz-option nzCustomContent [nzLabel]="getEmployeeFullName(emp)" [nzValue]="emp">
              <div class="d-flex align-items-center gap-2">
                <nz-avatar
                  [nzSize]="38"
                  nzIcon="user"
                  [nzSrc]="getEmployeeImageUrl(emp.user.image)"
                ></nz-avatar>
                <span>{{ getEmployeeFullName(emp) }}</span>
              </div>
            </nz-option>
          }
        </nz-select>
        <ng-template #tagPlaceHolder let-selectedList>
          and {{ selectedList.length }} more selected
        </ng-template>
      </div>
    </div>
  </ng-container>

  <div *nzModalFooter>
    <button
      class="drop-shadow-md"
      nz-button
      nzDanger
      nzType="default"
      (click)="handleCancel()"
      type="button"
    >
      Cancel Operation
    </button>
    <button
      class="drop-shadow-md"
      nz-button
      nzType="primary"
      (click)="handleOk()"
      [nzLoading]="tablesService.isSendingRequest()"
      type="button"
    >
      Assign Employee
    </button>
  </div>
</nz-modal>
