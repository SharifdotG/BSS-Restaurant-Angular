<div class="main-wrapper p-0 p-md-4 pb-md-0">
  <app-feature-table
    [data]="listOfTables()"
    [loading]="tablesService.isAnyLoading()"
    [total]="tablesService.totalTables()"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    scrollX="900px"
    addLabel="Add New Table"
    emptyText="No tables found."
    (addClick)="tablesService.showAddModal.set(true)"
    (queryParamsChange)="onQueryParamsChange($event)"
  >
    <ng-template ftColumn="image" ftWidth="80px" ftAlign="center" let-row>
      <nz-avatar [nzSize]="36" nzIcon="warning" [nzSrc]="getImageUrl(row.image)"></nz-avatar>
    </ng-template>

    <ng-template ftColumn="tableNumber" ftLabel="Table Number" ftWidth="auto" let-row>
      <span class="ft-cell-text">{{ row.tableNumber }}</span>
    </ng-template>

    <ng-template ftColumn="seats" ftLabel="Total Seats" ftWidth="auto" let-row>
      <span class="ft-cell-text">{{ row.numberOfSeats }}</span>
    </ng-template>

    <ng-template ftColumn="bookingStatus" ftLabel="Booking Status" ftWidth="auto" let-row>
      <span
        class="ds-badge"
        [class.ds-badge--success]="!row.isOccupied"
        [class.ds-badge--warning]="row.isOccupied"
      >
        {{ !row.isOccupied ? 'Available' : 'Not Available' }}
      </span>
    </ng-template>

    <ng-template ftColumn="employees" ftLabel="Assigned Employees" ftWidth="auto" let-row>
      <div class="d-flex gap-1 flex-wrap align-items-center">
        @for (employee of row.employees; track employee.employeeId) {
          <app-employee-tooltip
            [tableName]="row.tableNumber"
            [employeeName]="employee.name"
            [employeeId]="employee.employeeId"
            [employeeTableId]="employee.employeeTableId.toString()"
            [employeeList]="listOfEmployees()"
          ></app-employee-tooltip>
        }
        <button
          (click)="
            showAssignModal(String(row.id), row.tableNumber, row.image, row.numberOfSeats)
          "
          class="add-employee-to-table-button"
          type="button"
          nz-tooltip
          [nzTooltipTitle]="'Assign employees to ' + row.tableNumber"
          nzTooltipPlacement="top"
          [attr.aria-label]="'Assign employees to table ' + row.tableNumber"
        >
          <span
            class="add-employee-to-table-button-icon"
            nz-icon
            nzType="plus"
            nzTheme="outline"
            aria-hidden="true"
          ></span>
        </button>
      </div>
    </ng-template>

    <ng-template ftColumn="actions" ftWidth="180px" ftAlign="center" let-row>
      <div class="ft-row-actions">
        <button
          (click)="editTable(row.id)"
          class="drop-down-button drop-shadow-md"
          type="button"
          nz-tooltip
          [nzTooltipTitle]="'Edit table ' + row.tableNumber"
          nzTooltipPlacement="top"
          aria-label="Edit Table {{ row.tableNumber }}"
        >
          <span nz-icon nzType="edit" nzTheme="outline" aria-hidden="true"></span>
        </button>
        <button
          (click)="deleteTable(row.id)"
          class="drop-down-button drop-shadow-md"
          type="button"
          nz-tooltip
          [nzTooltipTitle]="'Delete table ' + row.tableNumber"
          nzTooltipPlacement="top"
          aria-label="Delete Table {{ row.tableNumber }}"
        >
          <span nz-icon nzType="delete" nzTheme="outline" aria-hidden="true"></span>
        </button>
      </div>
    </ng-template>
  </app-feature-table>
</div>
<app-add-table></app-add-table>
<app-assign-employee></app-assign-employee>
