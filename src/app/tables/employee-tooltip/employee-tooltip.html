<!-- Click-to-open menu attached to the avatar -->
<nz-dropdown-menu #menu="nzDropdownMenu">
  <ul nz-menu>
    <li nz-menu-item nzDisabled>
      <div class="row d-flex align-items-center justify-content-center pt-1 pb-1">
        <div class="col-12 d-flex justify-content-center align-items-center pb-2">
          <nz-avatar [nzSize]="72" nzIcon="user" [nzSrc]="employeeImageUrl()"></nz-avatar>
        </div>
        <div class="col-12 d-flex justify-content-center align-items-center p-1 mt-0">
          <span class="font-medium text-base text-center">
            {{ employeeName() }}
          </span>
        </div>
      </div>
    </li>
    <li (click)="showDeleteConfirm()" nz-menu-item class="delete-container">
      <button
        class="btn delete-button w-100 ps-0"
        type="button"
        aria-label="Remove {{ employeeName() }}"
      >
        <span nz-icon nzType="delete" nzTheme="outline" aria-hidden="true"></span>
        <span> Remove</span>
      </button>
    </li>
  </ul>
</nz-dropdown-menu>

<button
  type="button"
  class="employee-avatar-trigger"
  nz-dropdown
  nzTrigger="click"
  [nzDropdownMenu]="menu"
  nz-tooltip
  [nzTooltipTitle]="employeeName() + ' — click to remove'"
  nzTooltipPlacement="top"
  [attr.aria-label]="'Open menu for ' + employeeName()"
>
  <nz-avatar [nzSize]="36" nzIcon="user" [nzSrc]="employeeImageUrl()"></nz-avatar>
</button>
