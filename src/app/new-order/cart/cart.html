<nz-drawer
  [nzVisible]="newOrderService.showCart()"
  nzPlacement="right"
  [nzWidth]="600"
  nzTitle="Order Cart"
  (nzOnClose)="closeCart()"
  [nzBodyStyle]="{ padding: '0' }"
>
  <ng-container *nzDrawerContent>
    @if (newOrderService.cartFood().length) {
      <div class="d-flex flex-column justify-between h-100 overflow-y-clip">
        <div class="overflow-auto">
          @for (item of newOrderService.cartFood(); track item.food.id) {
            <div
              class="cart-item border-b-2 border-green-700 border-opacity-30 transition-colors duration-150"
            >
              <div class="d-flex w-100 align-items-center h-100 p-3">
                <img
                  nz-image
                  class="food-image rounded-lg drop-shadow-md"
                  [nzSrc]="getFoodImage(item.food.image)"
                  [alt]="item.food.name"
                  [nzFallback]="fallbackImage"
                />
                <div class="h-100 w-100 d-flex justify-content-between">
                  <div class="d-flex flex-column justify-content-between p-3 pt-0 pb-0 gap-2 pe-0">
                    <div class="text-lg md:text-xl">{{ item.food.name }}</div>
                    <div>
                      <span class="text-lg me-1 d-none d-sm-inline-block">Qty. </span>
                      <nz-input-number
                        [ngModel]="item.quantity"
                        (ngModelChange)="updateQuantity(item.food.id, $event)"
                        [nzMin]="1"
                        [nzMax]="10"
                        [nzStep]="1"
                        style="width: 100px"
                        aria-label="Quantity for {{ item.food.name }}"
                      ></nz-input-number>
                    </div>
                  </div>
                  <div class="d-flex flex-column justify-content-between align-items-end">
                    <button
                      (click)="removeFromCart(item.food.id)"
                      class="drop-down-button drop-shadow-md mt-1 transition-colors duration-150"
                      aria-label="Remove {{ item.food.name }} from cart"
                      title="Remove from cart"
                    >
                      <span nz-icon nzType="delete" nzTheme="outline" aria-hidden="true"></span>
                    </button>
                    <div class="text-md md:text-lg">Price: {{ item.amount * item.quantity }} ৳</div>
                  </div>
                </div>
              </div>
            </div>
          }
        </div>
        <div class="sub-total-container shadow-lg">
          <div
            class="w-100 d-flex justify-between border-b-2 border-t-2 border-green-700 border-opacity-30 p-4"
          >
            <div class="sub-total text-2xl">Sub-Total</div>
            <div class="sub-total text-2xl" aria-live="polite">{{ subtotal() }} ৳</div>
          </div>
          <div class="w-100 p-4 pb-2">
            <label for="phoneNumberInput" class="d-block mb-2 font-semibold text-gray-700"
              >Phone Number (Optional)</label
            >
            <input
              id="phoneNumberInput"
              nz-input
              [ngModel]="phoneNumber()"
              (ngModelChange)="phoneNumber.set($event)"
              placeholder="Enter customer phone number"
              type="tel"
              class="w-100 phone-input"
            />
          </div>
          <div class="w-100 p-4 pt-2">
            <button
              (click)="confirmOrder()"
              [disabled]="!newOrderService.selectedTableId()"
              class="submit-button text-center text-2xl transition-colors duration-200"
            >
              @if (newOrderService.selectedTableId()) {
                Confirm Order
              } @else {
                Select a table from New Order first
              }
            </button>
          </div>
        </div>
      </div>
    } @else {
      <div class="h-100 d-flex align-items-center justify-content-center" role="status">
        <div class="text-4xl text-gray-700">The Cart Is Empty!</div>
      </div>
    }
  </ng-container>
</nz-drawer>
