<div class="main-wrapper p-0 p-md-4 pb-md-0">
  <app-feature-table
    [data]="listOfFood()"
    [loading]="foodService.isSendingRequest()"
    [total]="foodService.totalFood()"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    scrollX="1000px"
    addLabel="Add Food Item"
    emptyText="No food items found."
    (addClick)="foodService.showAddModal.set(true)"
    (queryParamsChange)="onQueryParamsChange($event)"
  >
    <ng-template ftColumn="image" ftWidth="80px" ftAlign="center" let-row>
      <nz-avatar [nzSize]="36" nzIcon="warning" [nzSrc]="getImageUrl(row.image)"></nz-avatar>
    </ng-template>

    <ng-template ftColumn="name" ftLabel="Name" ftWidth="auto" let-row>
      <span class="ft-cell-text">{{ row.name }}</span>
    </ng-template>

    <ng-template ftColumn="price" ftLabel="Price" ftWidth="auto" let-row>
      <span class="ft-cell-text">{{ row.price }}</span>
    </ng-template>

    <ng-template ftColumn="discountType" ftLabel="Discount Type" ftWidth="auto" let-row>
      <span class="ft-cell-text">{{ row.discountType }}</span>
    </ng-template>

    <ng-template ftColumn="discount" ftLabel="Discount" ftWidth="auto" let-row>
      <span class="ft-cell-text">{{ getDiscountDisplay(row) }}</span>
    </ng-template>

    <ng-template ftColumn="discountPrice" ftLabel="Discounted Price" ftWidth="auto" let-row>
      <span class="ft-cell-text">{{ row.discountPrice }}</span>
    </ng-template>

    <ng-template ftColumn="actions" ftWidth="180px" ftAlign="center" let-row>
      <div class="ft-row-actions">
        <button
          (click)="editFood(row.id)"
          class="drop-down-button drop-shadow-md"
          nz-tooltip
          nzTooltipTitle="Edit food item"
          nzTooltipPlacement="top"
          aria-label="Edit Food"
        >
          <span nz-icon nzType="edit" nzTheme="outline"></span>
        </button>
        <button
          (click)="deleteFood(row.id)"
          class="drop-down-button drop-shadow-md"
          nz-tooltip
          nzTooltipTitle="Delete food item"
          nzTooltipPlacement="top"
          aria-label="Delete Food"
        >
          <span nz-icon nzType="delete" nzTheme="outline"></span>
        </button>
      </div>
    </ng-template>
  </app-feature-table>
</div>

<app-add-food></app-add-food>
