<ng-template #modalTitle>
  <span nz-icon nzType="user" nzTheme="outline" aria-hidden="true"></span>
  <span> User Profile </span>
</ng-template>

<nz-modal
  nzCentered
  [nzVisible]="authService.showProfile()"
  (nzVisibleChange)="authService.showProfile.set($event)"
  [nzTitle]="modalTitle"
  (nzOnOk)="handleClose()"
  (nzOnCancel)="handleClose()"
  [nzWidth]="600"
  aria-label="User profile"
>
  <ng-container *nzModalContent>
    <div class="container-fluid p-3 shadow-md rounded-md">
      <div class="row">
        <div class="col-12 col-md-4 d-flex align-items-center justify-content-center">
          <nz-avatar
            [nzSize]="130"
            nzIcon="user"
            [nzSrc]="userImageUrl()"
            class="drop-shadow-md"
            style="background-color: #66bb6a"
            aria-label="User profile picture"
          ></nz-avatar>
        </div>
        <div class="col-12 col-md-8 mt-3 mt-md-0">
          <div class="text-sm text-slate-600">Full Name</div>
          <div class="text-xl text-slate-700">{{ profile().fullName }}</div>

          <div class="mt-3 text-sm text-slate-600">Email</div>
          <div class="text-xl text-slate-700">{{ profile().email }}</div>

          <div class="mt-3 text-sm text-slate-600">Phone Number</div>
          <div class="text-xl text-slate-700">{{ phoneDisplay() }}</div>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-container *nzModalFooter>
    <button class="drop-shadow-md" nz-button nzType="primary" (click)="handleClose()">Close</button>
  </ng-container>
</nz-modal>
