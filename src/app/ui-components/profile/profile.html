<ng-template #modalTitle>
  <span class="ds-modal-title"> User profile </span>
</ng-template>

<nz-modal
  nzCentered
  [nzVisible]="authService.showProfile()"
  (nzVisibleChange)="authService.showProfile.set($event)"
  [nzTitle]="modalTitle"
  (nzOnOk)="handleClose()"
  (nzOnCancel)="handleClose()"
  [nzWidth]="560"
  nzWrapClassName="ds-form-modal"
  aria-label="User profile"
>
  <ng-container *nzModalContent>
    <div class="profile-card">
      <!-- Header band: avatar + name -->
      <div class="profile-header">
        <nz-avatar
          [nzSize]="96"
          nzIcon="user"
          [nzSrc]="userImageUrl()"
          class="profile-avatar"
          aria-label="User profile picture"
        ></nz-avatar>
        <div class="profile-header-text">
          <p class="profile-eyebrow">PROFILE</p>
          <h2 class="profile-name">{{ profile().fullName }}.</h2>
        </div>
      </div>

      <!-- Info rows -->
      <dl class="profile-rows">
        <div class="profile-row">
          <dt class="profile-row-label">EMAIL</dt>
          <dd class="profile-row-value">{{ profile().email }}</dd>
        </div>
        <div class="profile-row">
          <dt class="profile-row-label">PHONE</dt>
          <dd class="profile-row-value">{{ phoneDisplay() }}</dd>
        </div>
      </dl>
    </div>
  </ng-container>

  <ng-container *nzModalFooter>
    <button nz-button nzType="default" (click)="handleClose()">Close</button>
  </ng-container>
</nz-modal>
